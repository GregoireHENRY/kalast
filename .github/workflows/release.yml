# A tagged release: one executable per platform, the crate on crates.io, the
# package on PyPI.
#
# **The bundle is plug and play: kalast IS the executable.** Downloading it
# and running a `.py` example installs nothing, asks for no virtualenv and
# writes nothing to the user's machine. `pip install kalast` is for people
# who want the package, the way `cargo add` is -- not a step anyone has to
# take to use a release.
#
# That takes two pieces. The executable is built `--no-default-features`, so
# it links no libpython: with the `python` feature pyo3 links one by
# *absolute path* on macOS, naming a directory that exists on the build
# machine and nowhere else. And the bundle carries its own interpreter --
# python-build-standalone, relocatable, with the wheel from this same tag
# and `tools/bundle-requirements.txt` already installed in it. `run_script`
# in `src/bin/kalast.rs` looks for that interpreter beside the executable
# before it looks at `PATH`.
#
# Why a whole interpreter rather than embedding one: the examples import
# numpy, spiceypy, matplotlib, and `kalast/__init__.py` reaches scipy and
# pyarrow, so an embedded interpreter would need a site-packages beside it
# regardless. Shipping the interpreter with the site-packages is the same
# bytes, relocatable, and testable here before the tag goes out.
#
# A `.rs` example works too, and needed two changes to. The generated
# wrapper crate depended on `kalast` by *path*, which only exists in a clone;
# from a bundle it depends on the crates.io release of the exact version
# running, published by this same workflow. And compiling needs cargo, so if
# the machine has none the editor installs a minimal toolchain into
# `toolchain/` beside the executable -- the first time a `.rs` is actually
# compiled, not at first launch, because most people never open one and a
# toolchain is a few hundred megabytes.
# **How to release.** Bump the three manifests, write the version's section
# in CHANGELOG.md, push, run this workflow by hand
# (`gh workflow run release.yml`), and if it is green, **have the changelog
# section reviewed**, then tag that same commit. The tag run then finds the rehearsal by commit and **publishes its
# artefacts instead of building them again** -- a few minutes rather than
# twenty. A tag nobody rehearsed builds from scratch, exactly as before.
name: release

on:
  push:
    tags: ["v*"]
  # Builds the same artefacts without making a release, so the whole thing
  # can be rehearsed before a tag is cut.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # What pyproject.toml pins: `requires-python = ">=3.14.3,<3.15"`.
  PYTHON_VERSION: "3.14"
  # The interpreter the bundles carry. A dated release of
  # astral-sh/python-build-standalone, pinned rather than floating: a bundle
  # that silently changed Python between tags would be a different product.
  PBS_RELEASE: "20260901"
  PBS_PYTHON: "3.14.7"

jobs:
  # Three places carry the version and they must agree: the wheel and the
  # crate take theirs from the manifests, not from the tag, so a mismatch
  # ships `kalast-0.1.0` under a `v0.2.0` tag -- and a publish cannot be
  # taken back.
  version:
    name: the tag is publishable
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Check every manifest and both registries
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          field() { sed -n "/^\[$2\]/,/^\[/p" "$1" | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1; }
          cargo_version=$(field Cargo.toml package)
          macros_version=$(field macros/Cargo.toml package)
          py_version=$(field pyproject.toml project)
          macros_req=$(sed -n 's/^kalast_macros *= *{.*version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "tag $tag | Cargo.toml $cargo_version | macros $macros_version" \
               "| pyproject $py_version | kalast_macros req '$macros_req'"

          fail=0
          note() { echo "::error::$*"; fail=1; }

          # 1. The three manifests carry the version the artefacts are named
          #    by, and none of them reads the tag.
          [ "$tag" = "$cargo_version" ]  || note "Cargo.toml is $cargo_version, tag is v$tag"
          [ "$tag" = "$macros_version" ] || note "macros/Cargo.toml is $macros_version, tag is v$tag"
          [ "$tag" = "$py_version" ]     || note "pyproject.toml is $py_version, tag is v$tag"

          # 2. `cargo publish` resolves kalast_macros from the *registry*, not
          #    from macros/, so the requirement has to admit the version about
          #    to be published there. A requirement of "0.1" against a macros
          #    crate at 0.4.1 is why publishing failed before this check
          #    existed.
          case "$tag" in
            "$macros_req"|"$macros_req".*) ;;
            *) note "kalast_macros = \"$macros_req\" does not admit $tag -- set it to the version being published" ;;
          esac

          # 3. CHANGELOG.md has a `## v<tag>` section with at least one entry.
          #    The GitHub release is that section verbatim and nothing else,
          #    and a person reviews it before the tag is pushed; this is what
          #    makes forgetting impossible rather than merely unlikely.
          if ! awk -v v="v$tag" '$0 ~ "^## "v"([^0-9.]|$)"{f=1;next} /^## /{f=0} f&&/^- /{n++} END{exit !(n>0)}' CHANGELOG.md; then
            note "CHANGELOG.md has no '## v$tag' section with a '- ' entry -- write it, have it reviewed, then tag"
          fi

          # 4. Neither registry lets a version be published twice, and both
          #    already carry this project. Better to find out here than after
          #    the GitHub release exists and half the publishing is done.
          ua="User-Agent: kalast release workflow"
          if curl -sf -H "$ua" "https://crates.io/api/v1/crates/kalast/$tag" >/dev/null; then
            note "crates.io already has kalast $tag"
          fi
          if curl -sf -H "$ua" "https://crates.io/api/v1/crates/kalast_macros/$tag" >/dev/null; then
            echo "note: crates.io already has kalast_macros $tag; that step will be skipped"
          fi
          if curl -sf "https://pypi.org/pypi/kalast/$tag/json" >/dev/null; then
            note "PyPI already has kalast $tag"
          fi

          # 5. A warning, not an error: publishing below the registry's
          #    highest version is legal and occasionally deliberate, but
          #    `cargo add kalast` and `pip install kalast` would go on
          #    resolving to the older, higher one, so the release would be
          #    invisible to everyone who did not read the tag.
          # `grep -o`, not sed: the payload is one line with no trailing
          # newline and the sed form silently produced nothing, which made
          # this warning unreachable.
          latest=$(curl -sf -H "$ua" https://crates.io/api/v1/crates/kalast \
            | grep -o '"max_version":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "${latest:-}" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
            echo "::warning::crates.io already publishes kalast $latest;" \
                 "$tag is lower, so installers will keep resolving to $latest"
          fi

          exit $fail

  # A tag that was rehearsed publishes the rehearsal's artefacts. The match
  # is on the exact commit: same source, same manifests, same names (see
  # "Name the bundle"), so the bytes are the ones that would be built again.
  # Anything short of a successful rehearsal of *this* commit with all nine
  # artefacts still present falls through to building, exactly as before --
  # the one failure this must never have is publishing another commit's
  # bytes, and a SHA equality is a hard guarantee against that.
  #
  # Runs on every event so the build jobs can depend on it; on a dispatch it
  # simply answers "nothing".
  reuse:
    name: a rehearsal of this commit
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          none() { echo "$1 -- building"; echo "run_id=" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || none "not a tag"
          runs="repos/${{ github.repository }}/actions/workflows/release.yml/runs"
          id=$(gh api "$runs?head_sha=${{ github.sha }}&event=workflow_dispatch&status=success&per_page=1" \
                 --jq '.workflow_runs[0].id // empty')
          [ -n "$id" ] || none "no successful rehearsal of ${{ github.sha }}"
          want="bundle-linux-x86_64 bundle-macos-arm64 bundle-macos-x86_64 bundle-windows-x86_64 \
                pypi-sdist pypi-wheel-linux-x86_64 pypi-wheel-macos-arm64 pypi-wheel-macos-x86_64 pypi-wheel-windows-x86_64"
          have=" $(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" \
                    --jq '.artifacts[] | select(.expired | not) | .name' | tr '\n' ' ') "
          for a in $want; do
            case "$have" in *" $a "*) ;; *) none "rehearsal $id has no $a" ;; esac
          done
          echo "reusing run $id, rehearsed on this exact commit"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

  # macOS x86_64 runs on `macos-15-intel`, not `macos-13`. The macOS 13 image
  # was retired in December 2025, and a job asking for it does not fail -- it
  # sits "queued" until the run times out, which is what happened to both
  # macos-x86_64 jobs in run 35374536810 and why that run never completed or
  # served a log. `macos-15-intel` is the last x86_64 macOS image and is
  # available until August 2027; after that this target goes.
  executable:
    name: executable ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The bundle installs the wheel from this same tag into the interpreter it
    # ships, so the two cannot disagree about what this version is. It also
    # means a broken wheel now stops the executable, which is right: a bundle
    # whose Python half is missing is not one we want to publish.
    needs: [reuse, wheels]
    if: needs.reuse.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: linux-x86_64,   archive: tar, pbs: x86_64-unknown-linux-gnu }
          - { os: macos-14,        target: macos-arm64,    archive: tar, pbs: aarch64-apple-darwin }
          - { os: macos-15-intel,  target: macos-x86_64,   archive: tar, pbs: x86_64-apple-darwin }
          - { os: windows-latest,  target: windows-x86_64, archive: zip, pbs: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # winit and wgpu link X11, Wayland and Vulkan at build time; the runner
      # image carries none of the -dev packages.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev libvulkan-dev

      # Named first: the interpreter goes into the bundle *before* the
      # executable is built, and everything after this refers to it.
      - name: Name the bundle
        shell: bash
        run: |
          set -euo pipefail
          # From the manifest, not the ref -- on a rehearsal as much as on a
          # tag. That is what makes a rehearsal's archive, down to the
          # directory name inside it, byte for byte the release's, so the tag
          # run can publish it instead of building again. The version gate
          # guarantees manifest and tag agree when it matters.
          version="v$(sed -n '/^\[project\]/,/^\[/p' pyproject.toml | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)"
          echo "name=kalast-${version}-${{ matrix.target }}" >> "$GITHUB_ENV"
          # Built under a name with **no version and no commit in it**, and
          # renamed to `name` only at the end. The executable is linked with
          # `-L native=<stage>/python/lib`, cargo fingerprints every crate on
          # `RUSTFLAGS`, and while that path carried the commit it changed on
          # every push: nothing was ever reused from `Swatinem/rust-cache`,
          # all ~200 dependencies rebuilt every run, and 4 minutes became 24.
          echo "stage=dist/kalast-${{ matrix.target }}" >> "$GITHUB_ENV"

      # The wheel built by this run, for this platform, rather than whatever
      # PyPI happens to hold: on a first tag PyPI does not have it yet, and
      # on a re-run it would pin the bundle to an older build.
      - uses: actions/download-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: wheel

      - name: Put an interpreter in the bundle
        shell: bash
        run: |
          set -euo pipefail
          base="cpython-${PBS_PYTHON}+${PBS_RELEASE}-${{ matrix.pbs }}-install_only_stripped.tar.gz"
          curl -sSfL -o python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/${base}"
          # Unpacks as `python/`, which is where `bundled_python_dir` looks.
          rm -rf "${{ env.stage }}" && mkdir -p "${{ env.stage }}"
          tar -xzf python.tar.gz -C "${{ env.stage }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            py="${{ env.stage }}/python/python.exe"
          else
            py="${{ env.stage }}/python/bin/python3"
          fi
          "$py" -V

          # The requirements first, the wheel last and with --no-deps: what
          # `pyproject.toml` declares is what a *developer* wants available
          # and comes to 766 MB, most of which no example imports.
          # `tools/bundle-requirements.txt` is what `import kalast` reaches
          # plus what the shipped examples call. pip will say the rest is
          # missing; that is the point, and it does not fail.
          "$py" -m pip -q install --upgrade pip
          "$py" -m pip -q install -r tools/bundle-requirements.txt
          "$py" -m pip -q install --no-deps wheel/*.whl

          find "${{ env.stage }}/python" -name '__pycache__' -type d -prune -exec rm -rf {} + || true
          find "${{ env.stage }}/python" -type d \( -name tests -o -name test \) -prune \
            -exec rm -rf {} + || true

      # **With** the `embed` feature, linked against the interpreter above.
      # That is what lets a `.py` run in the window already open; without an
      # interpreter of its own the executable handed the script to a second
      # process and closed its window to make way for it.
      #
      # Neither flag is optional. python-build-standalone reports its
      # `LIBDIR` as `/install/lib`, the path inside the container it was
      # built in, so pyo3 emits `-lpython3.14` against a search path that
      # does not exist -- hence `-L native=`. And libpython's install name is
      # `@rpath/...`, so the rpaths are what make the result look beside
      # itself instead of at this runner.
      #
      # **Two rpaths, the executable's and a hosted library's, and this
      # exact list in this exact order.** `bundled_python_rustflags` in
      # `src/app/cargo.rs` writes the same six arguments for a guest, and
      # cargo fingerprints every crate on them: identical flags are what let
      # the precompile step below find the engine already built and compile
      # only its 30-line wrapper, instead of the whole thing a second time.
      - name: Build the kalast UI app
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/${{ env.stage }}/python"
          case "${{ runner.os }}" in
            Windows)
              export PYO3_PYTHON="$root/python.exe"
              export RUSTFLAGS="-L native=$root/libs"
              ;;
            macOS)
              export PYO3_PYTHON="$root/bin/python3"
              export RUSTFLAGS="-L native=$root/lib -C link-arg=-Wl,-rpath,@executable_path/python/lib -C link-arg=-Wl,-rpath,@loader_path/../../../../python/lib"
              ;;
            *)
              export PYO3_PYTHON="$root/bin/python3"
              export RUSTFLAGS="-L native=$root/lib -C link-arg=-Wl,-rpath,\$ORIGIN/python/lib -C link-arg=-Wl,-rpath,\$ORIGIN/../../../../python/lib"
              ;;
          esac
          echo "PYO3_PYTHON=$PYO3_PYTHON"
          echo "RUSTFLAGS=$RUSTFLAGS"
          cargo build --release --bin kalast

          # What pyo3 learned by running that interpreter, written down for
          # later. The bundle ships no interpreter binary -- the executable
          # carries its own -- so when a user rebuilds a `.rs`, pyo3 has
          # nothing to run and reads this instead (`configure_guest_link`
          # in src/app/cargo.rs, which rewrites the two build-machine paths
          # in it to the user's). `PYO3_PRINT_CONFIG` halts the compile on
          # purpose, hence the `|| true`.
          ( PYO3_PRINT_CONFIG=1 cargo build --release --lib 2>&1 || true ) \
            | sed -n 's/^ *\([a-z_]*=.*\)$/\1/p' > "$root/pyo3-config.txt"
          [ "$(grep -c . "$root/pyo3-config.txt")" -gt 5 ] || {
            echo "::error::pyo3 printed no configuration"; cat "$root/pyo3-config.txt"; exit 1
          }
          grep -E "^(version|shared|abi3|lib_name)=" "$root/pyo3-config.txt" | tr '\n' ' '; echo

      # The engine alone, which is still a supported build and the shape the
      # audit was written for. One platform: the same code three times buys
      # minutes, not coverage.
      - name: Engine tests
        if: runner.os == 'Linux'
        run: cargo test --release --lib --no-default-features

      # Into the bundle before it is run at all: it finds its libpython
      # beside itself, so from `target/release` it would not start.
      - name: Put the executable in the bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/kalast.exe "${{ env.stage }}/"
            # Windows resolves a DLL by name, searching the executable's own
            # directory but not `python/`, so libpython has to sit beside it.
            # *All* of them: with `abi3` pyo3 links the forwarder
            # `python3.dll`, which loads `python314.dll`, and there is a C
            # runtime beside them too. Copying only the versioned one left
            # an executable that did not start -- Git Bash reports that as
            # exit 127, which reads like a missing file when it is a
            # dependency that is.
            cp "${{ env.stage }}"/python/*.dll "${{ env.stage }}/"
            ls "${{ env.stage }}"/*.dll
          else
            cp target/release/kalast "${{ env.stage }}/"
          fi

      # A window cannot be opened on a runner, so this is how we find out
      # whether the interpreter linked into the executable actually works: a
      # relocated CPython reached through `PYTHONHOME`, and every way it can
      # fail looks like a bundle that opens fine and does nothing with a
      # script. A failure to *start* prints nothing at all, hence the `ls`.
      - name: The embedded interpreter works
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then exe=kalast.exe; else exe=kalast; fi
          "./${{ env.stage }}/$exe" --python-check || {
            echo "::error::the executable did not start; its directory holds:"
            ls -l "${{ env.stage }}"
            exit 1
          }

      # Built by the executable that is about to ship, not by a recipe
      # written here: `--precompile` runs the editor's own `write_wrapper`
      # and `build_hosted_blocking`, with the feature set the editor
      # expects. A second recipe in YAML would drift, and the way it would
      # show up is the editor silently recompiling everything the bundle
      # shipped.
      #
      # `KALAST_HOSTED_TARGET_DIR` points the guest build at the directory
      # the executable was just built in. Same features, same `RUSTFLAGS`,
      # same interpreter, so cargo finds kalast and its dependencies already
      # compiled and builds only the wrapper -- seconds, where a target
      # directory of its own meant the whole engine a second time. (Not on
      # Windows: the guest's `-L` path comes out of `current_exe` with
      # backslashes and does not match the host's, so it rebuilds there.
      # Correct, just slower.)
      #
      # `--force`, because with the target directory restored from cache a
      # library from a *previous* run can carry a matching source fingerprint
      # and a newer mtime while the engine underneath it has moved on --
      # shipping a guest built from last week's engine, which the ABI
      # fingerprint only catches if a layout changed.
      #
      # `examples/old/` is skipped: superseded, and none of it compiles.
      - name: Precompile the Rust examples
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            exe="$PWD/${{ env.stage }}/kalast.exe"
            export KALAST_HOSTED_TARGET_DIR="$(pwd -W)/target"
          else
            exe="$PWD/${{ env.stage }}/kalast"
            export KALAST_HOSTED_TARGET_DIR="$PWD/target"
          fi
          find examples -name '*.rs' -not -path 'examples/old/*' -print0 \
            | xargs -0 "$exe" --precompile --force 2>&1 | tee hosted-build.log
          grep '^built ' hosted-build.log | awk '{print $2}' > hosted-libs.txt
          [ -s hosted-libs.txt ] || { echo "::error::no hosted library was built"; exit 1; }

      - name: Assemble the rest of the bundle
        shell: bash
        run: |
          set -euo pipefail
          stage="${{ env.stage }}"

          # `res/` is read at runtime. `examples/` and `notes/` are to read
          # and to run. Not shipped: `shaders/`, compiled into the binary by
          # `include_wgsl!`, and `pyproject.toml`, which declares a build
          # system that cannot run from an archive and 766 MB of
          # dependencies the bundle does not have.
          cp -r res examples notes "$stage/"
          cp README.md "$stage/"

          # The hosted libraries, at the one path the editor looks for them:
          # `dylib_path_for` without `KALAST_HOSTED_TARGET_DIR` set, which is
          # how a user's editor runs. Anywhere else is a library it ignores
          # and recompiles, which is the whole point of shipping them.
          hosted="$stage/target/kalast-hosted/python/release"
          mkdir -p "$hosted"
          # The library and the fingerprint of the text it was built from:
          # `is_current` in a user's editor compares that against the file.
          while read -r lib; do cp "$lib" "$lib.source-hash" "$hosted/"; done < hosted-libs.txt
          # Explicitly newer than the examples copied beside them, since
          # `is_current` compares the two.
          touch "$hosted"/*

          # Now, and only now, the name that carries the version. Every
          # rpath inside is relative, so the rename is safe, and every step
          # from here on refers to `env.name`.
          mv "$stage" "dist/${{ env.name }}"

      # 49 MB of the interpreter that nothing in a bundle runs. `bin/python3`
      # (18 MB, a second CPython linked in statically -- the executable uses
      # `lib/libpython`), kalast's own extension module (15 MB; the embedded
      # interpreter gets the executable's bindings through `inittab` and
      # never loads it), pip, tcl/tk, headers. What goes with them is
      # `python/bin/python3 -m kalast` as a second way in, which opened the
      # same window; `./kalast script.py` is the way in.
      #
      # After every step that needed the interpreter binary: pyo3
      # introspected it to build, pip ran in it, and the config above was
      # dumped from it. Before the checks, so what they exercise is what
      # ships.
      - name: Prune the interpreter to what the UI app uses
        shell: bash
        working-directory: dist/${{ env.name }}
        run: |
          set -euo pipefail
          before=$(du -sm python | cut -f1)
          if [ "${{ runner.os }}" = "Windows" ]; then
            rm -rf python/python.exe python/pythonw.exe python/Scripts python/include python/tcl \
                   python/*.dll python/Lib/site-packages/pip* python/Lib/site-packages/kalast/_rs*.pyd
          else
            rm -rf python/bin python/include python/share python/lib/pkgconfig \
                   python/lib/tcl* python/lib/tk* python/lib/itcl* python/lib/thread* python/lib/libtcl* \
                   python/lib/python3.*/site-packages/pip* python/lib/python3.*/site-packages/kalast/_rs.abi3.so
          fi
          echo "python/ $before MB -> $(du -sm python | cut -f1) MB"
          [ -f python/pyo3-config.txt ] || { echo "::error::pyo3-config.txt missing after pruning"; exit 1; }

      # 3 MB off the executable and 3.5 off each hosted library -- about
      # 10 MB, for symbol names in a crash backtrace. Done before the checks
      # below, so what they exercise is exactly what ships.
      #
      # Windows keeps its symbols in `.pdb` files that are not shipped, so
      # there is nothing there to strip.
      - name: Strip what we ship
        if: runner.os != 'Windows'
        shell: bash
        working-directory: dist/${{ env.name }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then ext=dylib; flags="-x"
          else ext=so; flags="--strip-unneeded"; fi

          hosted=target/kalast-hosted/python/release
          before=$(du -sm . | cut -f1)
          # shellcheck disable=SC2086
          strip $flags kalast "$hosted"/*."$ext"
          echo "bundle $before MB -> $(du -sm . | cut -f1) MB"

          # `strip -x` and `--strip-unneeded` both keep exported symbols --
          # but a library that lost `kalast_abi` would still *load*, and the
          # editor would report "exports no kalast_abi" to a user rather
          # than to this job. Cheap to be sure.
          for lib in "$hosted"/*."$ext"; do
            for want in kalast_abi kalast_example; do
              if [ "${{ runner.os }}" = "macOS" ]; then found=$(nm -gU "$lib" | grep -c "_$want" || true)
              else found=$(nm -D "$lib" | grep -c " $want" || true); fi
              [ "$found" -ge 1 ] || {
                echo "::error::$lib no longer exports $want after stripping"
                exit 1
              }
            done
          done
          echo "the hosted libraries still export what the loader checks"

      # Nothing in this workflow used to run what it published, and all
      # three faults a user hit in v0.5.0 would have shown up here.
      - name: The bundle is the version it claims
        shell: bash
        working-directory: dist/${{ env.name }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then exe=./kalast.exe; else exe=./kalast; fi
          # Through the executable's own interpreter -- there is no other in
          # the bundle now. The version is compared with the checkout's,
          # since a bundle vouching for its own would prove nothing.
          out=$("$exe" --python-check)
          echo "$out"
          got=$(sed -n 's/^embedded interpreter OK: kalast \(.*\)$/\1/p' <<<"$out")
          want=$(sed -n '/^\[project\]/,/^\[/p' "$GITHUB_WORKSPACE/pyproject.toml" \
                 | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)
          [ -n "$got" ] && [ "$got" = "$want" ] || {
            echo "::error::the bundle carries kalast '$got' but this build is $want"
            exit 1
          }
          du -sm . | awk '{print "bundle unpacked: " $1 " MB"}'

      # Run in the bundle, where there is no source tree: `--precompile`
      # checks `is_current` before it builds anything, so "0 built" is proof
      # that the libraries shipped are the ones the editor will load. If a
      # path or a timestamp were wrong it would instead try to compile, and
      # from here that means crates.io, which does not have this version
      # until the `crates` job publishes it -- so it fails rather than
      # quietly producing a bundle that recompiles on first use.
      - name: The Rust examples are built, not merely shipped
        shell: bash
        working-directory: dist/${{ env.name }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then exe=./kalast.exe; else exe=./kalast; fi
          out=$(find examples -name '*.rs' -not -path 'examples/old/*' -print0 \
                | xargs -0 "$exe" --precompile)
          echo "$out"
          grep -q "0 built, 0 failed" <<<"$out" || {
            echo "::error::the bundle's hosted libraries are not the ones the editor looks for"
            exit 1
          }

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${{ env.name }}.zip" "${{ env.name }}" >/dev/null
          else
            tar -czf "${{ env.name }}.tar.gz" "${{ env.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  wheels:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x86_64,   manylinux: "auto" }
          - { os: macos-14,       target: macos-arm64,    manylinux: "" }
          - { os: macos-15-intel, target: macos-x86_64,   manylinux: "" }
          - { os: windows-latest, target: windows-x86_64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          sccache: "true"
          # `manylinux` is the *action's* input, not maturin's flag, and the
          # difference is the whole of the `wheel linux-x86_64` failure in run
          # 35374536810. Passing `--manylinux auto` through `args` reaches
          # maturin but tells the action nothing, so it never starts a
          # container: the build ran natively on ubuntu-24.04 and
          # `before-script-linux` ran on the host as an unprivileged user,
          # where `apt-get` cannot take its lock --
          #
          #     E: Could not open lock file /var/lib/apt/lists/lock (13: Permission denied)
          #
          # As the action's input it selects the manylinux image and runs the
          # build inside it, which is also what makes the wheel's tag a
          # manylinux one rather than a bare `linux_x86_64` that PyPI refuses.
          manylinux: ${{ matrix.manylinux }}

          # There is deliberately no `before-script-linux`. Every Linux system
          # library this project touches is loaded at *runtime*, not linked at
          # build time: `x11-dl` dlopens libX11, `wayland-sys` dlopens
          # libwayland through winit's default `wayland-dlopen`, and `ash`
          # dlopens libvulkan. So the container needs no -devel packages, and
          # installing them was solving a problem the build does not have --
          # while adding one, since a CentOS-7-based image has dead yum
          # mirrors unless its vault repos are pinned.
          #
          # If a header does turn out to be needed, maturin will name it,
          # which is a better failure than apt dying before maturin runs.

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: github release
    # `crates` as well as `executable`, and that is not belt and braces: a
    # `.rs` run from a bundle is compiled against `kalast = "=<this version>"`
    # on crates.io, so a release published before the crate exists ships an
    # archive whose Rust half cannot work. Waiting costs a few minutes. If
    # crates.io ever has to be skipped, drop it from here in the same commit
    # and know what the bundles lose.
    needs: [reuse, version, executable, crates]
    runs-on: ubuntu-latest
    # `executable` is skipped when a rehearsal is reused, and a skipped
    # dependency would skip this job too under the implicit `success()`;
    # hence the spelled-out condition. `crates` is never skipped: it
    # publishes from the checkout and a bundle's `.rs` rebuild depends on it.
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
          && needs.version.result == 'success' && needs.crates.result == 'success'
          && (needs.executable.result == 'success'
              || (needs.executable.result == 'skipped' && needs.reuse.outputs.run_id != '')) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true
          # This run's, or the rehearsal's. The token is required for the
          # latter and harmless for the former.
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      # Belt to the SHA match's braces: every archive about to be published
      # is named for this tag. A rehearsal of another commit could never be
      # selected, but a wrongly named artefact would be visible here first.
      - name: The archives are this tag's
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          for f in dist/*.tar.gz dist/*.zip; do
            case "$(basename "$f")" in kalast-${GITHUB_REF_NAME}-*) ;; *)
              echo "::error::$f is not a ${GITHUB_REF_NAME} archive"; exit 1 ;; esac
          done

      # The changelog is in the repository, not in the artefacts.
      - uses: actions/checkout@v4

      # The release body is this version's section of CHANGELOG.md, verbatim
      # -- a list of what changed, reviewed before the tag was pushed, and
      # no prose around it. The gate already refused a tag without one.
      - name: The release notes are this version's changelog section
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="${GITHUB_REF_NAME}" '$0 ~ "^## "v"([^0-9.]|$)"{f=1;next} /^## /{f=0} f' CHANGELOG.md \
            | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          [ -s release-notes.md ] || { echo "::error::empty changelog section for ${GITHUB_REF_NAME}"; exit 1; }
          echo "--- release body ---"; cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          body_path: release-notes.md

  pypi:
    name: publish to PyPI
    needs: [reuse, version, wheels, sdist]
    runs-on: ubuntu-latest
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/')
          && needs.version.result == 'success'
          && ((needs.wheels.result == 'success' && needs.sdist.result == 'success')
              || (needs.wheels.result == 'skipped' && needs.sdist.result == 'skipped'
                  && needs.reuse.outputs.run_id != '')) }}
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity, so there
      # is no API token to store or rotate. Configure the publisher once at
      # https://pypi.org/manage/project/kalast/settings/publishing/
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # One prefix rather than a brace list: the pattern is a plain
          # glob, and `{a,b}` is not one.
          pattern: pypi-*
          merge-multiple: true
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: The wheels are this tag's
        shell: bash
        run: |
          set -euo pipefail
          ls -l dist
          v="${GITHUB_REF_NAME#v}"
          for f in dist/*; do
            case "$(basename "$f")" in kalast-${v}-*|kalast-${v}.tar.gz) ;; *)
              echo "::error::$f is not a ${v} distribution"; exit 1 ;; esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `cargo publish` verifies by building, and the default features bring
      # in pyo3 and the window stack.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev libvulkan-dev

      # The macros crate first: `kalast` depends on it by version, so it has
      # to exist on the registry before `kalast` can be verified. Skipped
      # when that version is already up there -- its version moves rarely,
      # and `cargo publish` treats "already exists" as an error.
      - name: Publish kalast_macros, if that version is new
        working-directory: macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl -sf "https://crates.io/api/v1/crates/kalast_macros/$v" >/dev/null; then
            echo "kalast_macros $v is already on crates.io"
          else
            cargo publish
            # The index takes a moment to catch up, and the next step reads it.
            sleep 30
          fi

      - name: Publish kalast
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
