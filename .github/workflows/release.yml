# A tagged release: one executable per platform, the crate on crates.io, the
# package on PyPI.
#
# **The bundle is plug and play: kalast IS the executable.** Downloading it
# and running a `.py` example installs nothing, asks for no virtualenv and
# writes nothing to the user's machine. `pip install kalast` is for people
# who want the package, the way `cargo add` is -- not a step anyone has to
# take to use a release.
#
# That takes two pieces. The executable is built `--no-default-features`, so
# it links no libpython: with the `python` feature pyo3 links one by
# *absolute path* on macOS, naming a directory that exists on the build
# machine and nowhere else. And the bundle carries its own interpreter --
# python-build-standalone, relocatable, with the wheel from this same tag
# and `tools/bundle-requirements.txt` already installed in it. `run_script`
# in `src/bin/kalast.rs` looks for that interpreter beside the executable
# before it looks at `PATH`.
#
# Why a whole interpreter rather than embedding one: the examples import
# numpy, spiceypy, matplotlib, and `kalast/__init__.py` reaches scipy and
# pyarrow, so an embedded interpreter would need a site-packages beside it
# regardless. Shipping the interpreter with the site-packages is the same
# bytes, relocatable, and testable here before the tag goes out.
#
# A `.rs` example works too, and needed two changes to. The generated
# wrapper crate depended on `kalast` by *path*, which only exists in a clone;
# from a bundle it depends on the crates.io release of the exact version
# running, published by this same workflow. And compiling needs cargo, so if
# the machine has none the editor installs a minimal toolchain into
# `toolchain/` beside the executable -- the first time a `.rs` is actually
# compiled, not at first launch, because most people never open one and a
# toolchain is a few hundred megabytes.
name: release

on:
  push:
    tags: ["v*"]
  # Builds the same artefacts without making a release, so the whole thing
  # can be rehearsed before a tag is cut.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # What pyproject.toml pins: `requires-python = ">=3.14.3,<3.15"`.
  PYTHON_VERSION: "3.14"
  # The interpreter the bundles carry. A dated release of
  # astral-sh/python-build-standalone, pinned rather than floating: a bundle
  # that silently changed Python between tags would be a different product.
  PBS_RELEASE: "20260901"
  PBS_PYTHON: "3.14.7"

jobs:
  # Three places carry the version and they must agree: the wheel and the
  # crate take theirs from the manifests, not from the tag, so a mismatch
  # ships `kalast-0.1.0` under a `v0.2.0` tag -- and a publish cannot be
  # taken back.
  version:
    name: the tag is publishable
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Check every manifest and both registries
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          field() { sed -n "/^\[$2\]/,/^\[/p" "$1" | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1; }
          cargo_version=$(field Cargo.toml package)
          macros_version=$(field macros/Cargo.toml package)
          py_version=$(field pyproject.toml project)
          macros_req=$(sed -n 's/^kalast_macros *= *{.*version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "tag $tag | Cargo.toml $cargo_version | macros $macros_version" \
               "| pyproject $py_version | kalast_macros req '$macros_req'"

          fail=0
          note() { echo "::error::$*"; fail=1; }

          # 1. The three manifests carry the version the artefacts are named
          #    by, and none of them reads the tag.
          [ "$tag" = "$cargo_version" ]  || note "Cargo.toml is $cargo_version, tag is v$tag"
          [ "$tag" = "$macros_version" ] || note "macros/Cargo.toml is $macros_version, tag is v$tag"
          [ "$tag" = "$py_version" ]     || note "pyproject.toml is $py_version, tag is v$tag"

          # 2. `cargo publish` resolves kalast_macros from the *registry*, not
          #    from macros/, so the requirement has to admit the version about
          #    to be published there. A requirement of "0.1" against a macros
          #    crate at 0.4.1 is why publishing failed before this check
          #    existed.
          case "$tag" in
            "$macros_req"|"$macros_req".*) ;;
            *) note "kalast_macros = \"$macros_req\" does not admit $tag -- set it to the version being published" ;;
          esac

          # 3. Neither registry lets a version be published twice, and both
          #    already carry this project. Better to find out here than after
          #    the GitHub release exists and half the publishing is done.
          ua="User-Agent: kalast release workflow"
          if curl -sf -H "$ua" "https://crates.io/api/v1/crates/kalast/$tag" >/dev/null; then
            note "crates.io already has kalast $tag"
          fi
          if curl -sf -H "$ua" "https://crates.io/api/v1/crates/kalast_macros/$tag" >/dev/null; then
            echo "note: crates.io already has kalast_macros $tag; that step will be skipped"
          fi
          if curl -sf "https://pypi.org/pypi/kalast/$tag/json" >/dev/null; then
            note "PyPI already has kalast $tag"
          fi

          # 4. A warning, not an error: publishing below the registry's
          #    highest version is legal and occasionally deliberate, but
          #    `cargo add kalast` and `pip install kalast` would go on
          #    resolving to the older, higher one, so the release would be
          #    invisible to everyone who did not read the tag.
          # `grep -o`, not sed: the payload is one line with no trailing
          # newline and the sed form silently produced nothing, which made
          # this warning unreachable.
          latest=$(curl -sf -H "$ua" https://crates.io/api/v1/crates/kalast \
            | grep -o '"max_version":"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -n "${latest:-}" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
            echo "::warning::crates.io already publishes kalast $latest;" \
                 "$tag is lower, so installers will keep resolving to $latest"
          fi

          exit $fail

  # macOS x86_64 runs on `macos-15-intel`, not `macos-13`. The macOS 13 image
  # was retired in December 2025, and a job asking for it does not fail -- it
  # sits "queued" until the run times out, which is what happened to both
  # macos-x86_64 jobs in run 35374536810 and why that run never completed or
  # served a log. `macos-15-intel` is the last x86_64 macOS image and is
  # available until August 2027; after that this target goes.
  executable:
    name: executable ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The bundle installs the wheel from this same tag into the interpreter it
    # ships, so the two cannot disagree about what this version is. It also
    # means a broken wheel now stops the executable, which is right: a bundle
    # whose Python half is missing is not one we want to publish.
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,   target: linux-x86_64,   archive: tar, pbs: x86_64-unknown-linux-gnu }
          - { os: macos-14,        target: macos-arm64,    archive: tar, pbs: aarch64-apple-darwin }
          - { os: macos-15-intel,  target: macos-x86_64,   archive: tar, pbs: x86_64-apple-darwin }
          - { os: windows-latest,  target: windows-x86_64, archive: zip, pbs: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # The hosted wrapper builds kalast a second time into a target
          # directory of its own -- deliberately, so a `python`-featured
          # guest cannot land beside a plain one -- and without this that
          # second build starts from nothing every run.
          cache-directories: target/kalast-hosted

      # winit and wgpu link X11, Wayland and Vulkan at build time; the runner
      # image carries none of the -dev packages.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev libvulkan-dev

      # Named first: the interpreter goes into the bundle *before* the
      # executable is built, and everything after this refers to it.
      - name: Name the bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA:0:7}"
          fi
          echo "name=kalast-${version}-${{ matrix.target }}" >> "$GITHUB_ENV"

      # The wheel built by this run, for this platform, rather than whatever
      # PyPI happens to hold: on a first tag PyPI does not have it yet, and
      # on a re-run it would pin the bundle to an older build.
      - uses: actions/download-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: wheel

      - name: Put an interpreter in the bundle
        shell: bash
        run: |
          set -euo pipefail
          base="cpython-${PBS_PYTHON}+${PBS_RELEASE}-${{ matrix.pbs }}-install_only_stripped.tar.gz"
          curl -sSfL -o python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/${base}"
          # Into `runtime/python`, a path with **no version and no commit in
          # it**, and only moved into the bundle once the build is done.
          #
          # This is not tidiness. The executable is linked with
          # `-L native=<here>/lib`, and cargo fingerprints every crate on
          # `RUSTFLAGS` -- so while this path was `dist/kalast-dev-<sha>-…`
          # it changed on every push, nothing was ever reused from
          # `Swatinem/rust-cache`, and all ~200 dependencies rebuilt every
          # run. That is what took `executable macos-x86_64` from 4 minutes
          # to 24.
          rm -rf runtime && mkdir -p runtime
          tar -xzf python.tar.gz -C runtime

          if [ "${{ runner.os }}" = "Windows" ]; then
            py="runtime/python/python.exe"
          else
            py="runtime/python/bin/python3"
          fi
          "$py" -V

          # The requirements first, the wheel last and with --no-deps: what
          # `pyproject.toml` declares is what a *developer* wants available
          # (pymeshlab, astropy, pandas, symfit) and comes to 766 MB, most of
          # which no example imports. `tools/bundle-requirements.txt` is the
          # closure `import kalast` actually reaches. pip will say those four
          # are missing; that is the point, and it does not fail.
          "$py" -m pip -q install --upgrade pip
          "$py" -m pip -q install -r tools/bundle-requirements.txt
          "$py" -m pip -q install --no-deps wheel/*.whl

          find runtime/python -name '__pycache__' -type d -prune -exec rm -rf {} + || true
          find runtime/python -type d \( -name tests -o -name test \) -prune \
            -exec rm -rf {} + || true

      # **With** the `python` feature, linked against the interpreter above.
      # That is what lets a `.py` run in the window already open. Without it
      # the executable had no interpreter, handed the script to a second
      # process, and closed its own window to make way for it -- which is
      # what users saw, and is the opposite of the rule in CLAUDE.md that
      # Rust owns the loop and calls Python for the interpreter.
      #
      # Neither flag is optional. python-build-standalone reports its
      # `LIBDIR` as `/install/lib`, the path inside the container it was
      # built in, so pyo3 emits `-lpython3.14` against a search path that
      # does not exist -- hence `-L native=`. And libpython's install name
      # is `@rpath/libpython3.14.dylib`, so the rpath is what makes the
      # result look beside itself instead of at a directory on this runner.
      - name: Build the kalast UI app
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/runtime/python"
          case "${{ runner.os }}" in
            Windows)
              export PYO3_PYTHON="$root/python.exe"
              export RUSTFLAGS="-L native=$root/libs"
              ;;
            macOS)
              export PYO3_PYTHON="$root/bin/python3"
              export RUSTFLAGS="-L native=$root/lib -C link-arg=-Wl,-rpath,@executable_path/python/lib"
              ;;
            *)
              export PYO3_PYTHON="$root/bin/python3"
              export RUSTFLAGS="-L native=$root/lib -C link-arg=-Wl,-rpath,\$ORIGIN/python/lib"
              ;;
          esac
          echo "PYO3_PYTHON=$PYO3_PYTHON"
          echo "RUSTFLAGS=$RUSTFLAGS"
          cargo build --release --bin kalast

      # The engine alone, which is still a supported build and the shape the
      # audit was written for. One platform: the same code three times buys
      # minutes, not coverage.
      - name: Engine tests
        if: runner.os == 'Linux'
        run: cargo test --release --lib --no-default-features

      # Into the bundle before it is run at all: it finds its libpython
      # beside itself, so from `target/release` it would not start.
      - name: Put the interpreter and the executable in the bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ env.name }}"
          # Moved, not copied: it is 400 MB and nothing needs it twice.
          mv runtime/python "dist/${{ env.name }}/python"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/kalast.exe "dist/${{ env.name }}/"
            # Windows resolves a DLL by name, searching the executable's own
            # directory but not `python/`, so libpython has to sit beside it.
            #
            # *All* of them, not `python314.dll` alone: with `abi3-py314`
            # pyo3 links the stable-ABI forwarder `python3.dll`, which then
            # loads `python314.dll`, and there is a C runtime beside them
            # too. Copying only the versioned one left an executable that
            # did not start at all -- Git Bash reports that as exit 127,
            # which reads like the file is missing when it is a dependency
            # that is.
            cp "dist/${{ env.name }}"/python/*.dll "dist/${{ env.name }}/"
            ls "dist/${{ env.name }}"/*.dll
          else
            cp target/release/kalast "dist/${{ env.name }}/"
          fi

      # A window cannot be opened on a runner, so this is how we find out
      # whether the interpreter linked into the executable actually works.
      # Worth checking on every platform: it is a relocated CPython reached
      # through `PYTHONHOME`, and every way it can fail -- wrong prefix, a
      # library the loader cannot find, an abi3 mismatch -- looks like a
      # bundle that opens fine and then does nothing with a script.
      - name: The embedded interpreter works
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then exe=kalast.exe; else exe=kalast; fi
          # On a failure to *start* -- a dependency the loader cannot find --
          # there is no output at all, so say what is there before giving up.
          "./dist/${{ env.name }}/$exe" --python-check || {
            echo "::error::the executable did not start; its directory holds:"
            ls -l "dist/${{ env.name }}"
            exit 1
          }

      # Built by the executable that is about to ship, not by a recipe
      # written here: `--precompile` runs the editor's own `write_wrapper`
      # and `build_hosted_blocking`, so the libraries land in the directory
      # `is_current` looks in, with the feature set it expects. A second
      # recipe in YAML would drift, and the way it would show up is the
      # editor silently recompiling everything the bundle shipped.
      #
      # Run from the checkout, so the wrapper takes kalast as a path
      # dependency rather than from crates.io -- which at tag time does not
      # yet carry this version.
      #
      # `examples/old/` is skipped. README calls those superseded and not
      # user-facing, and five of the seven `.rs` files under `examples/`
      # are there -- none of them compiles against the current API.
      - name: Precompile the Rust examples
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then exe="$PWD/dist/${{ env.name }}/kalast.exe"
          else exe="$PWD/dist/${{ env.name }}/kalast"; fi
          find examples -name '*.rs' -not -path 'examples/old/*' -print0 \
            | xargs -0 "$exe" --precompile

      - name: Assemble the rest of the bundle
        shell: bash
        run: |
          set -euo pipefail
          name="${{ env.name }}"

          # `res/` is read at runtime. `examples/` and `notes/` are to read
          # and to run. `shaders/` is *not* shipped: every one of them is
          # compiled into the binary by `include_wgsl!`, so a copy in the
          # bundle can be edited all day and change nothing -- which is worse
          # than not having it.
          cp -r res examples notes "dist/$name/"
          # The README here is reStructuredText, not Markdown.
          #
          # `pyproject.toml` is **not** shipped. It was, and it was
          # misleading in the way `shaders/` was: it declares a
          # `[build-system]` that cannot run from an archive and 766 MB of
          # dependencies the bundle neither has nor needs, so `pip install .`
          # from inside one does the wrong thing.
          cp README.rst "dist/$name/"

          # The hosted libraries, at the one path the editor looks for them.
          # `dylib_path_for` builds it from `build_dir()`, so a library
          # anywhere else is one the editor ignores and recompiles -- which
          # is the whole point of shipping them. `python`, not `plain`,
          # because the executable now carries an interpreter.
          case "${{ runner.os }}" in
            Windows) ext=dll ;;
            macOS)   ext=dylib ;;
            *)       ext=so ;;
          esac
          hosted=target/kalast-hosted/python/release
          mkdir -p "dist/$name/$hosted"
          cp "$hosted"/*."$ext" "dist/$name/$hosted/"
          # Explicitly newer than the examples just copied beside them.
          # `is_current` compares the two, and without this the libraries
          # are current only by the accident of `cp -r examples` running
          # first -- an ordering nothing else in this file depends on.
          touch "dist/$name/$hosted"/*."$ext"

      # 3 MB off the executable, 3.7 off the extension module and 3.5 off
      # each hosted library -- about 14 MB, for symbol names in a crash
      # backtrace. Done before the checks below, so what they exercise is
      # exactly what ships.
      #
      # Windows keeps its symbols in `.pdb` files that are not shipped, so
      # there is nothing there to strip.
      - name: Strip what we ship
        if: runner.os != 'Windows'
        shell: bash
        working-directory: dist/${{ env.name }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then ext=dylib; flags="-x"
          else ext=so; flags="--strip-unneeded"; fi

          hosted=target/kalast-hosted/python/release
          before=$(du -sm . | cut -f1)
          # shellcheck disable=SC2086
          strip $flags kalast python/lib/python*/site-packages/kalast/_rs.abi3.so "$hosted"/*."$ext"
          echo "bundle $before MB -> $(du -sm . | cut -f1) MB"

          # `strip -x` and `--strip-unneeded` both keep exported symbols --
          # but a library that lost `kalast_abi` would still *load*, and the
          # editor would report "exports no kalast_abi" to a user rather
          # than to this job. Cheap to be sure.
          for lib in "$hosted"/*."$ext"; do
            for want in kalast_abi kalast_example; do
              if [ "${{ runner.os }}" = "macOS" ]; then found=$(nm -gU "$lib" | grep -c "_$want" || true)
              else found=$(nm -D "$lib" | grep -c " $want" || true); fi
              [ "$found" -ge 1 ] || {
                echo "::error::$lib no longer exports $want after stripping"
                exit 1
              }
            done
          done
          echo "the hosted libraries still export what the loader checks"

      # Nothing in this workflow used to run what it published, and all
      # three faults a user hit in v0.5.0 would have shown up here.
      - name: Import kalast from the bundle
        shell: bash
        working-directory: dist/${{ env.name }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then py=python/python.exe; else py=python/bin/python3; fi
          # Run from inside the bundle, never from the checkout: a clone has
          # its own `kalast/` package whose extension is linked against the
          # developer's libpython, and importing that one segfaults.
          #
          # The version, not just the import: this is the only place the
          # wheel actually in the bundle is compared with the one this tag
          # is publishing. Read from the checkout, not from the bundle --
          # the bundle no longer carries `pyproject.toml`, and a bundle
          # vouching for its own version would prove nothing anyway.
          want=$(sed -n '/^\[project\]/,/^\[/p' "$GITHUB_WORKSPACE/pyproject.toml" \
                 | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)
          got=$("$py" -c "import importlib.metadata as m; print(m.version('kalast'))")
          "$py" -c "import kalast; print('kalast', '$got', 'from', kalast.__file__)"
          [ "$got" = "$want" ] || {
            echo "::error::the bundle carries kalast $got but this build is $want"
            exit 1
          }
          du -sm . | awk '{print "bundle unpacked: " $1 " MB"}'

      # Run in the bundle, where there is no source tree: `--precompile`
      # checks `is_current` before it builds anything, so "0 built" is proof
      # that the libraries shipped are the ones the editor will load. If a
      # path or a timestamp were wrong it would instead try to compile, and
      # from here that means crates.io, which does not have this version
      # until the `crates` job publishes it -- so it fails rather than
      # quietly producing a bundle that recompiles on first use.
      - name: The Rust examples are built, not merely shipped
        shell: bash
        working-directory: dist/${{ env.name }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then exe=./kalast.exe; else exe=./kalast; fi
          out=$(find examples -name '*.rs' -not -path 'examples/old/*' -print0 \
                | xargs -0 "$exe" --precompile)
          echo "$out"
          grep -q "0 built, 0 failed" <<<"$out" || {
            echo "::error::the bundle's hosted libraries are not the ones the editor looks for"
            exit 1
          }

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${{ env.name }}.zip" "${{ env.name }}" >/dev/null
          else
            tar -czf "${{ env.name }}.tar.gz" "${{ env.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  wheels:
    name: wheel ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux-x86_64,   manylinux: "auto" }
          - { os: macos-14,       target: macos-arm64,    manylinux: "" }
          - { os: macos-15-intel, target: macos-x86_64,   manylinux: "" }
          - { os: windows-latest, target: windows-x86_64, manylinux: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          sccache: "true"
          # `manylinux` is the *action's* input, not maturin's flag, and the
          # difference is the whole of the `wheel linux-x86_64` failure in run
          # 35374536810. Passing `--manylinux auto` through `args` reaches
          # maturin but tells the action nothing, so it never starts a
          # container: the build ran natively on ubuntu-24.04 and
          # `before-script-linux` ran on the host as an unprivileged user,
          # where `apt-get` cannot take its lock --
          #
          #     E: Could not open lock file /var/lib/apt/lists/lock (13: Permission denied)
          #
          # As the action's input it selects the manylinux image and runs the
          # build inside it, which is also what makes the wheel's tag a
          # manylinux one rather than a bare `linux_x86_64` that PyPI refuses.
          manylinux: ${{ matrix.manylinux }}

          # There is deliberately no `before-script-linux`. Every Linux system
          # library this project touches is loaded at *runtime*, not linked at
          # build time: `x11-dl` dlopens libX11, `wayland-sys` dlopens
          # libwayland through winit's default `wayland-dlopen`, and `ash`
          # dlopens libvulkan. So the container needs no -devel packages, and
          # installing them was solving a problem the build does not have --
          # while adding one, since a CentOS-7-based image has dead yum
          # mirrors unless its vault repos are pinned.
          #
          # If a header does turn out to be needed, maturin will name it,
          # which is a better failure than apt dying before maturin runs.

      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: github release
    # `crates` as well as `executable`, and that is not belt and braces: a
    # `.rs` run from a bundle is compiled against `kalast = "=<this version>"`
    # on crates.io, so a release published before the crate exists ships an
    # archive whose Rust half cannot work. Waiting costs a few minutes. If
    # crates.io ever has to be skipped, drop it from here in the same commit
    # and know what the bundles lose.
    needs: [version, executable, crates]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bundle-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
          body: |
            **Unpack it and run it. There is nothing to install.**

            ```
            ./kalast                                   # the kalast UI app
            ./kalast examples/two_spheres/main.py      # an example
            ./kalast some/shape.obj                    # a mesh
            ```

            | | |
            |---|---|
            | `kalast` / `kalast.exe` | the kalast UI app. Open it on its own, or give it a `.obj`, a `.py` or a `.rs` |
            | `python/` | the interpreter the `.py` examples run in, with kalast and its dependencies already in it. Nothing is installed on your machine and nothing is written outside this folder |
            | `res/` | the meshes and colour maps the examples load |
            | `target/` | the `.rs` examples, already compiled. Delete it and they are rebuilt from source instead |
            | `examples/`, `notes/`, `README.rst` | to read and to run |

            Run it from inside the unpacked folder — the examples load `res/`
            by a relative path.

            **`pip install kalast` is a different way in, not a prerequisite**
            — for putting kalast in your own environment, the way `cargo add`
            does. This release publishes it too.

            `examples/two_spheres` and `examples/cube` need nothing but the
            bundled `res/`. The Hera and Didymos examples carry absolute paths
            to shape models and SPICE kernels that are not shipped here — see
            "First-time setup" in `CLAUDE.md`.

            **The `.rs` examples come compiled**, so opening one loads it and
            runs, with no cargo and no toolchain involved. `examples/old/` is
            the exception — those are superseded and do not build against the
            current API; they are shipped to read, not to run.

            **Editing a `.rs`, or opening one of your own, means compiling
            it**, and that needs cargo. If the machine has none, the kalast
            UI app fetches a minimal toolchain into `toolchain/` beside the
            executable and reuses it after that — nothing goes into your
            `$HOME`, and deleting the folder removes it. Your example is
            compiled against the crates.io release of this same version, so
            no clone is needed either. On macOS it also wants Apple's command
            line tools for the linker (`xcode-select --install`); the kalast
            UI app says so up front rather than failing at the link step.

            That first build is a few minutes, and the Log panel shows cargo
            working through it; later ones are seconds. It is not small
            either — about 460 MB of toolchain and 600 MB of build directory,
            both inside this folder, both reclaimed by deleting it.

  pypi:
    name: publish to PyPI
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      # Trusted publishing: PyPI verifies this workflow's identity, so there
      # is no API token to store or rotate. Configure the publisher once at
      # https://pypi.org/manage/project/kalast/settings/publishing/
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # One prefix rather than a brace list: the pattern is a plain
          # glob, and `{a,b}` is not one.
          pattern: pypi-*
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    name: publish to crates.io
    needs: version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `cargo publish` verifies by building, and the default features bring
      # in pyo3 and the window stack.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols \
            libgl1-mesa-dev libvulkan-dev

      # The macros crate first: `kalast` depends on it by version, so it has
      # to exist on the registry before `kalast` can be verified. Skipped
      # when that version is already up there -- its version moves rarely,
      # and `cargo publish` treats "already exists" as an error.
      - name: Publish kalast_macros, if that version is new
        working-directory: macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if curl -sf "https://crates.io/api/v1/crates/kalast_macros/$v" >/dev/null; then
            echo "kalast_macros $v is already on crates.io"
          else
            cargo publish
            # The index takes a moment to catch up, and the next step reads it.
            sleep 30
          fi

      - name: Publish kalast
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
