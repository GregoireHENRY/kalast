[package]
name = "kalast"
version = "0.5.8"
description = "TPM for binary asteroids"
authors = ["Grégoire Henry <gregoireh@pm.me>"]
repository = "https://github.com/GregoireHENRY/kalast"
license = "MIT OR Apache-2.0"

# What goes into the crates.io package. Without this cargo packs the whole
# working tree -- 477 files, `res/ico7.obj` at 12 MB and `notes/` at 5 MB --
# and crates.io refuses anything over 10 MB. Only what the build reads at
# compile time belongs here: the shaders, the three `include_bytes!`/
# `include_str!` resources, and the two meshes the library's own tests load.
# `examples/`, `notes/` and the rest of `res/` ship in the release bundle
# instead, which is where a user of the *program* looks for them.
# Leading slashes anchor to the package root: these are gitignore-style
# globs, so a bare `README.md` matched five of them inside `.venv/`.
include = [
    "/src/**/*.rs",
    "/shaders/*.wgsl",
    "/res/cube.obj",
    "/res/ico3.obj",
    "/res/plane_crater_1024-5000_h=0.437.obj",
    "/res/DejaVuSans.ttf",
    "/res/happy-tree.png",
    "/Cargo.toml",
    "/README.md",
]
edition = "2024"
# keywords = []
# categories = []

[lib]
name = "kalast"
crate-type = ["lib", "cdylib"]

[features]
# Python is on by default so that `cargo run --bin kalast` can run a `.py`
# example in its own window, which needs an interpreter in the process. The
# engine without it is still a build away, and that is the shape the audit in
# `notes/2026-09-09_rust_core_audit.md` was written for:
#
#     cargo build --no-default-features        engine alone, no pyo3
#     cargo test --lib --no-default-features   tests without a Python install
#
# Being a *default* feature rather than a mandatory dependency is what keeps
# that true: the dependency is opt-out, not unconditional.
default = ["embed"]
use_f64 = ["tobj/use_f64"]

# The Python bindings. On their own they say nothing about *linking*, which
# is the whole point of the two features below it: pyo3 has to be told
# whether this build will start an interpreter or be loaded into one, and
# the two answers are mutually exclusive.
python = ["dep:pyo3", "dep:numpy"]

# A binary that carries an interpreter. `auto-initialize` is what lets it
# start one -- pyo3 0.28 keeps the explicit entry point private -- and it
# makes pyo3 link libpython. The default, so `cargo run --bin kalast` can run
# a `.py` in its own window.
embed = ["python", "pyo3/auto-initialize"]

# An extension module, loaded into an interpreter that already exists.
# `extension-module` makes pyo3 link *nothing*: the symbols come from the
# host at load time. This is what pyproject.toml asks maturin for, and it
# is not optional. Without it pyo3 links whatever libpython the build
# machine's Python reports, by absolute path -- and python-build-standalone's
# `bin/python3` has its interpreter linked in statically, so an extension
# that brings a second one segfaults on import. The wheels on PyPI worked
# only because the GitHub runner's Python happened to be one pyo3 did not
# link against.
ext = ["python", "pyo3/extension-module"]

[dependencies]
# The editor's Open button: the platform's own file picker (NSOpenPanel,
# IFileDialog, GTK on Linux -- `libgtk-3-dev` at build time there).
rfd = "0.15"
kalast_macros = { path = "macros", version = "0.5" }

# Generic
zerocopy = "0.8.47"
anyhow = "1.0.102"
snafu = "0.9"
serde = "1.0"
# The update check and download (`src/app/update.rs`): HTTPS with rustls,
# nothing from the system.
ureq = "3"
serde_json = "1"
env_logger = "0.11.9"
confique = { version = "0.2.0", features = ["toml", "yaml", "json5"] }
lazy_static = "1.5"
once_cell = "1.21.4"
itertools = "0.14"
paste = "1.0"
crossbeam = "0.8"

# Albegra
glam = { version = "0.32.1", features = ["serde", "bytemuck"] }
ndarray = "0.17.2"

# Mesh
# tobj = { version = "4.0", features = ["use_f64"] }
tobj = { version = "4.0" }

# Python
pyo3 = { version = "0.28", optional = true, features = [
    "experimental-inspect",
    "abi3-py314",
    "multiple-pymethods",
    # Windows needs a Python import library to link against, and without this
    # it has to find a real interpreter to derive one from. `maturin develop`
    # always has one -- the active venv -- so the gap only shows in
    # `maturin build`, which is what the release workflow runs:
    #
    #     Need a Python interpreter to compile for Windows without PyO3's
    #     `generate-import-lib` feature
    #
    # That is the whole of the `wheel windows-x86_64` failure in run
    # 35374536810, reproduced locally on Windows. With this, pyo3 generates
    # the import library itself and the build needs no interpreter at all,
    # which is also what makes an abi3 wheel cross-compilable.
    "generate-import-lib"
] }
numpy = { version = "0.28", optional = true }

# Loading a compiled example into the running editor. See
# `notes/API.md`, "Rust examples".
libloading = "0.8"

# Window/GPU
bytemuck = { version = "1.25", features = ["derive"] }
memoffset = "0.9"
winit = { version = "0.30.13", features = ["android-native-activity"] }
wgpu = { version = "30", features = ["serde"] }
wgpu_text = "30"
pollster = "0.4"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "hdr",
] }
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
raw-window-handle = "0.6.2"


[dev-dependencies]
rstest = "0.26.1"
serial_test = "3.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }

# Release (`maturin develop --release`) is what every benchmark and every
# production run should use; debug is 2-15x slower here, worst on the
# per-pixel export loops.
#
# Beyond the default opt-level = 3 there is nothing worth adding: `lto = "fat"`
# + `codegen-units = 1` was measured on this project and gave no improvement
# (render loop 52.7 vs 55.1 it/s, mesh load+flatten 1.07 vs 1.10 s -- both
# inside run-to-run noise) while pushing the build from ~59 s to ~87 s. The
# render path is GPU-bound and the hot CPU loops are already vectorised at
# opt-level 3.
#
# Deliberately NOT set: panic = "abort" -- PyO3 turns Rust panics into Python
# exceptions, which needs unwinding.

# Examples are not auto-discovered here: cargo looks for `examples/*.rs` or
# `examples/<name>/main.rs`, and these directories hold a Python script of the
# same name beside the Rust one. Naming them explicitly also gives the editor
# something to map an opened file back to -- it reads this table to work out
# which `--example` to build.
[[example]]
name = "crater_step"
path = "examples/crater_self_shadow/step.rs"

[[example]]
name = "crater_main"
path = "examples/crater_self_shadow/main.rs"

# Only the editor's stdout capture uses it, and that is Unix-only: Windows has
# no dup2 on descriptor 1, so the capture is compiled out there entirely.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# `kalast.exe` is a windows-subsystem program (no console window from
# Explorer) that attaches to the terminal it was started from, if any.
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
